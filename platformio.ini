[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    PubSubClient
    ArduinoJson
build_flags = -Iinclude

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    PubSubClient
    ArduinoJson
build_flags = -Iinclude