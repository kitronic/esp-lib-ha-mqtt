name: Lint

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.h'
      - '**.cpp'
      - '**.ino'
  pull_request:
    paths:
      - '**.h'
      - '**.cpp'
      - '**.ino'
  workflow_dispatch:

jobs:
  clang-format:
    name: Check C++ Formatting (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      # ═══════════════════════════════════════════════════
      #  🔑 non-blocking: لا يُفشل الـ CI، فقط يعرض التحذير
      # ═══════════════════════════════════════════════════
      - name: Check formatting
        continue-on-error: true
        run: |
          FILES=$(find src -name '*.cpp' -o -name '*.h' 2>/dev/null || true)

          if [ -z "$FILES" ]; then
            echo "ℹ️ No source files to check"
            exit 0
          fi

          echo "→ Files to check:"
          echo "$FILES"
          echo ""

          NEEDS_FORMAT=0
          for f in $FILES; do
            if ! clang-format --dry-run --Werror "$f" 2>/dev/null; then
              echo "⚠️  Needs formatting: $f"
              NEEDS_FORMAT=$((NEEDS_FORMAT + 1))
            fi
          done

          if [ $NEEDS_FORMAT -gt 0 ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚠️  $NEEDS_FORMAT file(s) need formatting"
            echo "💡 Fix locally: clang-format -i src/*.cpp src/*.h"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo "✅ All files properly formatted"
          fi

  markdown-lint:
    name: Check Required Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md || (echo "❌ README.md missing" && exit 1)
          test -f CHANGELOG.md || (echo "❌ CHANGELOG.md missing" && exit 1)
          echo "✅ Required markdown files present"