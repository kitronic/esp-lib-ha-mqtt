name: Build & Test

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════
  #  1. ترجمة الأمثلة على ESP8266 و ESP32
  # ═══════════════════════════════════════════
  build-examples:
    name: Build Examples (${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - espressif8266
          - espressif32

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.15

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.platform }}-${{ hashFiles('**/platformio.ini', 'library.json') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.platform }}-

      # ═══════════════════════════════════════════════════
      #  🔑 الخطوة الحاسمة: نسخ المكتبة إلى lib/HAMQTT/
      #     حتى يجدها PlatformIO تلقائياً
      # ═══════════════════════════════════════════════════
      - name: Prepare library for CI
        run: |
          mkdir -p lib/HAMQTT/src
          cp src/*.h src/*.cpp lib/HAMQTT/src/ 2>/dev/null || true
          cp library.json lib/HAMQTT/
          cp library.properties lib/HAMQTT/ 2>/dev/null || true
          echo "→ Library prepared at lib/HAMQTT/"
          ls -la lib/HAMQTT/
          ls -la lib/HAMQTT/src/

      - name: Create CI PlatformIO config
        run: |
          cat > platformio.ini << 'EOF'
          [platformio]
          src_dir = examples/BasicHA
          default_envs = ${{ matrix.platform }}

          [env]
          framework = arduino
          lib_deps =
              knolleary/PubSubClient@^2.8
          lib_ldf_mode = deep+
          build_flags =
              -D HA_MAX_ENTITIES=16
              -D HA_MAX_CACHE=24

          [env:espressif8266]
          platform = espressif8266
          board = nodemcuv2

          [env:espressif32]
          platform = espressif32
          board = esp32dev
          EOF

      - name: Build BasicHA example
        run: pio run

      - name: Build simple_sensor example
        run: |
          sed -i 's|src_dir = examples/BasicHA|src_dir = examples/simple_sensor|' platformio.ini
          pio run

  # ═══════════════════════════════════════════
  #  2. اختبارات Unit (native) — اختياري
  # ═══════════════════════════════════════════
  unit-tests:
    name: Unit Tests (native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.15

      - name: Run native tests
        run: |
          if [ -f platformio.ini ] && grep -q "env:native" platformio.ini; then
            pio test -e native
          else
            echo "ℹ️ No native test environment — skipping."
          fi
        continue-on-error: true

  # ═══════════════════════════════════════════
  #  3. تحقق من بنية المكتبة + الإصدارات
  # ═══════════════════════════════════════════
  lint-library:
    name: Lint Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check library structure
        run: |
          echo "→ Checking library.json..."
          test -f library.json || (echo "❌ library.json missing" && exit 1)
          python -c "import json; json.load(open('library.json'))" || (echo "❌ library.json invalid" && exit 1)

          echo "→ Checking library.properties..."
          test -f library.properties || (echo "❌ library.properties missing" && exit 1)
          grep -q "^name=" library.properties || (echo "❌ name missing" && exit 1)
          grep -q "^version=" library.properties || (echo "❌ version missing" && exit 1)
          grep -q "^author=" library.properties || (echo "❌ author missing" && exit 1)

          echo "✅ Library structure OK"

      - name: Verify version consistency
        run: |
          JSON_VER=$(python -c "import json; print(json.load(open('library.json'))['version'])")
          PROPS_VER=$(grep '^version=' library.properties | cut -d'=' -f2 | tr -d '[:space:]')

          echo "library.json       → $JSON_VER"
          echo "library.properties → $PROPS_VER"

          if [ "$JSON_VER" != "$PROPS_VER" ]; then
            echo "❌ Version mismatch"
            exit 1
          fi
          echo "✅ Versions match: $JSON_VER"

      - name: Check source structure
        run: |
          echo "→ Checking src/ folder..."
          test -d src || (echo "❌ src/ missing" && exit 1)
          test -f src/HAMQTT.h || (echo "❌ src/HAMQTT.h missing" && exit 1)
          test -f src/HAMQTT.cpp || (echo "❌ src/HAMQTT.cpp missing" && exit 1)
          echo "✅ src/ structure OK"

      - name: Check examples structure
        run: |
          echo "→ Checking examples/ folder..."
          test -d examples || (echo "❌ examples/ missing" && exit 1)
          test -d examples/BasicHA || (echo "❌ examples/BasicHA/ missing" && exit 1)
          test -f examples/BasicHA/BasicHA.ino || (echo "❌ BasicHA.ino missing" && exit 1)
          echo "✅ examples/ structure OK"